name: Deploy

# Replaces the automatic deploys Railway used to do. On a push to main this
# asks the apps box to run its own deploy script, which pulls this commit,
# installs, migrates (snapshotting the database first if the schema changes),
# restarts and smoke-tests - rolling back if the smoke test fails.
on:
  push:
    branches: [main]
    # Documentation does not reach the running site, so changing it should not
    # pull, install, migrate and restart the service. Merging #107 - one new
    # markdown file, no application code - did exactly that.
    #
    # Listed file by file rather than as a **.md glob, deliberately. Markdown
    # exists inside staticfiles/ as vendored licences and changelogs, and a
    # change under there means the collected static assets have moved, which
    # very much does need deploying. A glob would silently skip that.
    #
    # documentation/ is 42 screenshots and PDFs that README.md and TESTING.md
    # link to. Nothing serves them.
    #
    # Anything absent from this list still deploys, so requirements.txt,
    # templates, this workflow and every line of Python are unaffected. A push
    # touching both documentation and code deploys, because the filter only
    # skips when every changed file matches.
    paths-ignore:
      - 'README.md'
      - 'TESTING.md'
      - 'CLAUDE.md'
      - 'documentation/**'
  workflow_dispatch:      # so a deploy can also be triggered by hand

# One deploy at a time. Without this, two quick merges could have the box
# pulling a new commit while the previous run is still installing.
concurrency:
  group: deploy-cultfilmclub
  cancel-in-progress: false

permissions:
  id-token: write         # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # No AWS keys are stored in GitHub. This exchanges a short-lived OIDC
      # token for temporary credentials; the role only trusts this repo's main
      # branch and can only invoke the DeployCultfilmclub document on the one instance.
      #
      # That trust is pinned to the repository NAME as well as its immutable ID.
      # The role's trust policy matches the token's subject claim as an exact
      # string, so renaming or moving this repository can break deploys - which
      # is not obvious from the failure, because the error ("Not authorized to
      # perform sts:AssumeRoleWithWebIdentity") names neither the repository nor
      # the condition that did not match. This has happened once already, to
      # kanban. The ID form below survives a rename; keep both.
      #
      # The role is defined in apps-box-config/infra/github-actions-deploy-role.yaml.
      # Change it there and apply the stack - not by hand in the console.
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::115019371912:role/github-actions-deploy-cultfilmclub
          aws-region: eu-west-2

      - name: Deploy
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --document-name DeployCultfilmclub \
            --instance-ids i-07bca300c5bb852d9 \
            --comment "GitHub Actions: ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Poll rather than using `aws ssm wait`, so the deploy script's own
          # output ends up in the workflow log whether it passes or fails.
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07bca300c5bb852d9 \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id i-07bca300c5bb852d9 \
            --query StandardOutputContent --output text

          errors=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id i-07bca300c5bb852d9 \
            --query StandardErrorContent --output text)
          [ -n "$errors" ] && { echo "--- stderr ---"; echo "$errors"; }

          echo "--- status: $status ---"
          [ "$status" = "Success" ]
